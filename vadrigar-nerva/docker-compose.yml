services:
  nervad:
    image: sn1f3rt/nerva:latest@sha256:888417ae11481476ecde6b38a45b8300fe9c8e21d053c72f0d4e903b7282c7a2
    restart: on-failure
    ports:
      - "17566:17566"
      - "17565:17565"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command: >
      exit
      nervad
      --data-dir=/data
      --p2p-bind-ip=0.0.0.0 \
      --p2p-bind-port=17565 \
      --rpc-bind-ip=0.0.0.0
      --rpc-bind-port=17566
      --confirm-external-bind
      --non-interactive